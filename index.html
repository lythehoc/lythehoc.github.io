<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào bạn!</title>
    <link rel="icon" href="https://www.mediafire.com/convkey/10a8/0f41k3j9ud6vxix6g.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            font: 16px/1.4 Lato, sans-serif;
            color: #fefeff;
            -webkit-font-smoothing: antialiased;
            font-smoothing: antialiased;
            font-family: Comic Sans MS;
            background: #080510;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        h1 {
            font: 2.75em Cinzel, serif;
            font-weight: 400;
            letter-spacing: .35em;
            text-shadow: 0 0 25px rgba(254,254,255,.85);
        }

        h2 {
            font: 1.45em Cinzel, serif;
            font-weight: 400;
            letter-spacing: .5em;
            text-shadow: 0 0 25px rgba(254,254,255,.85);
            text-transform: lowercase;
        }

        [class^=letter] {
            transition: opacity 3s ease;
        }

        .letter-0 { transition-delay: .2s; }
        .letter-1 { transition-delay: .4s; }
        .letter-2 { transition-delay: .6s; }
        .letter-3 { transition-delay: .8s; }
        .letter-4 { transition-delay: 1s; }
        .letter-5 { transition-delay: 1.2s; }
        .letter-6 { transition-delay: 1.4s; }
        .letter-7 { transition-delay: 1.6s; }
        .letter-8 { transition-delay: 1.8s; }
        .letter-9 { transition-delay: 2s; }
        .letter-10 { transition-delay: 2.2s; }
        .letter-11 { transition-delay: 2.4s; }
        .letter-12 { transition-delay: 2.6s; }
        .letter-13 { transition-delay: 2.8s; }
        .letter-14 { transition-delay: 3s; }

        h1, h2 {
            visibility: hidden;
            transform: translate3d(0,0,0);
        }

        h1.transition-in, h2.transition-in {
            visibility: visible;
        }

        h1 [class^=letter], h2 [class^=letter] {
            opacity: 0;
        }

        h1.transition-in [class^=letter], h2.transition-in [class^=letter] {
            opacity: 1;
        }

        #container {
            display: table;
            position: absolute;
            z-index: 20;
            width: 100%;
            height: 100%;
            text-align: center;
            cursor: none;
        }

        #container > div {
            display: table-cell;
            vertical-align: middle;
        }

        #container p {
            position: absolute;
            width: 100%;
            left: 0;
            bottom: 25px;
            font-size: .8em;
            letter-spacing: .1em;
            font-weight: 300;
            color: #76747a;
            -webkit-font-smoothing: subpixel-antialiased;
            font-smoothing: subpixel-antialiased;
        }

        #container p strong {
            color: #b3abc5;
        }

        #container p span {
            font-size: .75em;
            padding: 0 2px;
        }

        #canvas {
            position: absolute;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        .logo {
            width: 300px;
            margin: 20px auto;
        }

        .social-link {
            color: #fefeff;
            text-decoration: none;
            font-size: 1.2em;
            margin: 20px 0;
            display: inline-block;
        }

        .audio-player {
            width: min(220px, calc(100vw - 32px));
            margin: 22px auto 18px;
            padding: 9px 11px;
            display: flex;
            align-items: center;
            gap: 9px;
            border: 1px solid rgba(255,255,255,.13);
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.045));
            box-shadow: 0 12px 35px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            cursor: default;
        }

        .audio-player audio {
            display: none;
        }

        .play-button {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 50%;
            color: #fff;
            background: linear-gradient(135deg, #d9f7ff 0%, #63d8ff 55%, #3288ff 100%);
            box-shadow: 0 7px 22px rgba(72,177,255,.30);
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        .play-button:hover {
            transform: translateY(-1px) scale(1.04);
            box-shadow: 0 9px 28px rgba(72,177,255,.40);
            filter: brightness(1.07);
        }

        .play-button:active {
            transform: scale(.96);
        }

        .play-button svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            pointer-events: none;
        }

        .player-main {
            min-width: 0;
            flex: 1;
        }

        .player-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .track-name {
            overflow: hidden;
            color: rgba(255,255,255,.92);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .02em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress {
            width: 100%;
            height: 4px;
            display: block;
            margin: 0;
            border: 0;
            border-radius: 999px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background: linear-gradient(to right, rgba(215,248,255,.98) 0%, rgba(69,177,255,.98) var(--progress, 0%), rgba(255,255,255,.14) var(--progress, 0%), rgba(255,255,255,.14) 100%);
            cursor: pointer;
        }

        .progress::-webkit-slider-thumb {
            width: 12px;
            height: 12px;
            border: 0;
            border-radius: 50%;
            appearance: none;
            -webkit-appearance: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(72,177,255,.18);
        }

        .progress::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(72,177,255,.18);
        }

        .marquee {
            width: fit-content;
            max-width: calc(100vw - 32px);
            margin: 22px auto 0;
            padding: 4px 14px 8px;
            font-family: "Segoe Script", "Brush Script MT", "Snell Roundhand", "Apple Chancery", cursive;
            font-size: clamp(1.55rem, 3.8vw, 2.15rem);
            font-weight: 500;
            letter-spacing: .025em;
            text-transform: none;
            line-height: 1.25;
            color: transparent;
            background: linear-gradient(100deg, #ffffff 0%, #bfeeff 42%, #67c9f5 68%, #eafaff 100%);
            background-size: 180% auto;
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(70,180,230,.20), 0 0 22px rgba(135,220,255,.14);
            transform: rotate(-2deg);
            animation: quoteShimmer 8s ease-in-out infinite alternate;
        }


        @keyframes quoteShimmer {
            from { background-position: 0% center; }
            to { background-position: 100% center; }
        }

        @media (prefers-reduced-motion: reduce) {
            .marquee { animation: none; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div>
            <img class="logo" src="https://www.mediafire.com/convkey/d674/2mxm6pdnhdr0mf06g.jpg" alt="Logo">
            <h1 id="h1">LÝ THẾ HỌC</h1>
            <h2 id="h2"></h2>
            <a href="https://fb.com/lythehoc" class="social-link" target="_blank">fb.com/lythehoc</a>
            <div class="audio-player">
                <audio id="bgAudio" autoplay loop preload="metadata">
                    <source src="Thanh_Xuan.m4a" type="audio/mp4">
                    Your browser does not support the audio element.
                </audio>
                <button class="play-button" id="playButton" type="button" aria-label="Play audio">
                    <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5.5v13l10-6.5z"></path>
                    </svg>
                </button>
                <div class="player-main">
                    <div class="player-topline">
                        <span class="track-name">Thanh Xuân</span>
                    </div>
                    <input class="progress" id="progressBar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Audio progress">
                </div>
            </div>
            <div class="marquee">
                We only live once
            </div>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        var Stats=function(){var e=Date.now(),t=e,i=0,n=1/0,r=0,s=0,o=1/0,a=0,l=0,h=0,c=document.createElement("div");c.id="stats",c.addEventListener("mousedown",function(e){e.preventDefault(),v(++h%2)},!1),c.style.cssText="width:80px;opacity:0.9;cursor:pointer";var u=document.createElement("div");u.id="fps",u.style.cssText="padding:0 0 3px 3px;text-align:left;background-color:#002",c.appendChild(u);var d=document.createElement("div");d.id="fpsText",d.style.cssText="color:#0ff;font-family:Comic Sans MS;font-size:9px;font-weight:bold;line-height:15px",d.innerHTML="FPS",u.appendChild(d);var p=document.createElement("div");for(p.id="fpsGraph",p.style.cssText="position:relative;width:74px;height:30px;background-color:#0ff",u.appendChild(p);74>p.children.length;){var f=document.createElement("span");f.style.cssText="width:1px;height:30px;float:left;background-color:#113",p.appendChild(f)}var m=document.createElement("div");m.id="ms",m.style.cssText="padding:0 0 3px 3px;text-align:left;background-color:#020;display:none",c.appendChild(m);var g=document.createElement("div");g.id="msText",g.style.cssText="color:#0f0;font-family:Comic Sans MS;font-size:9px;font-weight:bold;line-height:15px",g.innerHTML="MS",m.appendChild(g);var y=document.createElement("div");for(y.id="msGraph",y.style.cssText="position:relative;width:74px;height:30px;background-color:#0f0",m.appendChild(y);74>y.children.length;){var f=document.createElement("span");f.style.cssText="width:1px;height:30px;float:left;background-color:#131",y.appendChild(f)}var v=function(e){switch(h=e){case 0:u.style.display="block",m.style.display="none";break;case 1:u.style.display="none",m.style.display="block"}},b=function(e,t){var i=e.appendChild(e.firstChild);i.style.height=t+"px"};return{REVISION:11,domElement:c,setMode:v,begin:function(){e=Date.now()},end:function(){var h=Date.now();return i=h-e,n=Math.min(n,i),r=Math.max(r,i),g.textContent=i+" MS ("+n+"-"+r+")",b(y,Math.min(30,30-30*(i/200))),l++,h>t+1e3&&(s=Math.round(1e3*l/(h-t)),o=Math.min(o,s),a=Math.max(a,s),d.textContent=s+" FPS ("+o+"-"+a+")",b(p,Math.min(30,30-30*(s/100))),t=h,l=0),h},update:function(){e=this.end()}}};
        ;(function(window) {
        var ctx,
        hue,
        logo,
        form,
        buffer,
        target = {},
        tendrils = [],
        settings = {};
        settings.debug = false;
        settings.friction = 0.5;
        settings.trails = 20;
        settings.size = 50;
        settings.dampening = 0.25;
        settings.tension = 0.98;
        Math.TWO_PI = Math.PI * 2;
        // Oscillator
        function Oscillator(options) {
        this.init(options || {});
        }
        Oscillator.prototype = (function() {
        var value = 0;
        return {
        init: function(options) {
        this.phase = options.phase || 0;
        this.offset = options.offset || 0;
        this.frequency = options.frequency || 0.001;
        this.amplitude = options.amplitude || 1;
        },
        update: function() {
        this.phase += this.frequency;
        value = this.offset + Math.sin(this.phase) * this.amplitude;
        return value;
        },
        value: function() {
        return value;
        }
        };
        })();
        // Tendril
        function Tendril(options) {
        this.init(options || {});
        }
        Tendril.prototype = (function() {
        function Node() {
        this.x = 0;
        this.y = 0;
        this.vy = 0;
        this.vx = 0;
        }
        return {
        init: function(options) {
        this.spring = options.spring + (Math.random() * 0.1) - 0.05;
        this.friction = settings.friction + (Math.random() * 0.01) - 0.005;
        this.nodes = [];
        for(var i = 0, node; i < settings.size; i++) {
        node = new Node();
        node.x = target.x;
        node.y = target.y;
        this.nodes.push(node);
        }
        },
        update: function() {
        var spring = this.spring,
        node = this.nodes[0];
        node.vx += (target.x - node.x) * spring;
        node.vy += (target.y - node.y) * spring;
        for(var prev, i = 0, n = this.nodes.length; i < n; i++) {
        node = this.nodes[i];
        if(i > 0) {
        prev = this.nodes[i - 1];
        node.vx += (prev.x - node.x) * spring;
        node.vy += (prev.y - node.y) * spring;
        node.vx += prev.vx * settings.dampening;
        node.vy += prev.vy * settings.dampening;
        }
        node.vx *= this.friction;
        node.vy *= this.friction;
        node.x += node.vx;
        node.y += node.vy;
        spring *= settings.tension;
        }
        },
        draw: function() {
        var x = this.nodes[0].x,
        y = this.nodes[0].y,
        a, b;
        ctx.beginPath();
        ctx.moveTo(x, y);
        for(var i = 1, n = this.nodes.length - 2; i < n; i++) {
        a = this.nodes[i];
        b = this.nodes[i + 1];
        x = (a.x + b.x) * 0.5;
        y = (a.y + b.y) * 0.5;
        ctx.quadraticCurveTo(a.x, a.y, x, y);
        }
        a = this.nodes[i];
        b = this.nodes[i + 1];
        ctx.quadraticCurveTo(a.x, a.y, b.x, b.y);
        ctx.stroke();
        ctx.closePath();
        }
        };
        })();
        // ----------------------------------------------------------------------------------------
        function init(event) {
        document.removeEventListener('mousemove', init);
        document.removeEventListener('touchstart', init);
        document.addEventListener('mousemove', mousemove);
        document.addEventListener('touchmove', mousemove);
        document.addEventListener('touchstart', touchstart);
        mousemove(event);
        reset();
        loop();
        }
        function reset() {
        tendrils = [];
        for(var i = 0; i < settings.trails; i++) {
        tendrils.push(new Tendril({
        spring: 0.45 + 0.025 * (i / settings.trails)
        }));
        }
        }
        function loop() {
        if(!ctx.running) return;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(8,5,16,0.4)';
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'hsla(' + Math.round(hue.update()) + ',90%,50%,0.25)';
        ctx.lineWidth = 1;
        if(ctx.frame % 60 == 0) {
        console.log(hue.update(), Math.round(hue.update()), hue.phase, hue.offset, hue.frequency, hue.amplitude);
        }
        for(var i = 0, tendril; i < settings.trails; i++) {
        tendril = tendrils[i];
        tendril.update();
        tendril.draw();
        }
        ctx.frame++;
        ctx.stats.update();
        requestAnimFrame(loop);
        }
        function resize() {
        ctx.canvas.width = window.innerWidth;
        ctx.canvas.height = window.innerHeight;
        }
        function start() {
        if(!ctx.running) {
        ctx.running = true;
        loop();
        }
        }
        function stop() {
        ctx.running = false;
        }
        function mousemove(event) {
        if(event.touches) {
        target.x = event.touches[0].pageX;
        target.y = event.touches[0].pageY;
        } else {
        target.x = event.clientX
        target.y = event.clientY;
        }
        event.preventDefault();
        }
        function touchstart(event) {
        if(event.touches.length == 1) {
        target.x = event.touches[0].pageX;
        target.y = event.touches[0].pageY;
        }
        }
        function keyup(event) {
        switch(event.keyCode) {
        case 32:
        save();
        break;
        default:
        // console.log(event.keyCode);
        }
        }
        function letters(id) {
        var el = document.getElementById(id),
        letters = el.innerHTML.replace('&amp;', '&').split(''),
        heading = '';
        for(var i = 0, n = letters.length, letter; i < n; i++) {
        letter = letters[i].replace('&', '&amp');
        heading += letter.trim() ? '<span class="letter-' + i + '">' + letter + '</span>' : '&nbsp;';
        }
        el.innerHTML = heading;
        setTimeout(function() {
        el.className = 'transition-in';
        }, (Math.random() * 500) + 500);
        }
        function save() {
        if(!buffer) {
        buffer = document.createElement('canvas');
        buffer.width = screen.availWidth;
        buffer.height = screen.availHeight;
        buffer.ctx = buffer.getContext('2d');
        form = document.createElement('form');
        form.method = 'post';
        form.input = document.createElement('input');

        form.input.name = 'data';
        form.appendChild(form.input);
        document.body.appendChild(form);
        }
        buffer.ctx.fillStyle = 'rgba(8,5,16)';

        Math.round(buffer.width / 2 - canvas.width / 2),

        );
        buffer.ctx.drawImage(logo,

        Math.round(buffer.height / 2 - logo.height / 4),
        logo.width / 2,
        logo.height / 2
        );
        window.open(buffer.toDataURL(), 'wallpaper', 'top=0,left=0,width=' + buffer.width + ',height=' + buffer.height);

        // form.submit();
        }

        });
        letters('h1');
        letters('h2');
        document.addEventListener('mousemove', init);

        // Modern custom audio controls (no volume control)
        window.addEventListener('load', function() {
            var audio = document.getElementById('bgAudio');
            var playButton = document.getElementById('playButton');
            var playIcon = document.getElementById('playIcon');
            var progressBar = document.getElementById('progressBar');
            function updatePlayIcon() {
                if (audio.paused) {
                    playIcon.innerHTML = '<path d="M8 5.5v13l10-6.5z"></path>';
                    playButton.setAttribute('aria-label', 'Play audio');
                } else {
                    playIcon.innerHTML = '<path d="M7 5h4v14H7zm6 0h4v14h-4z"></path>';
                    playButton.setAttribute('aria-label', 'Pause audio');
                }
            }

            function updateProgress() {
                var percent = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
                progressBar.value = percent;
                progressBar.style.setProperty('--progress', percent + '%');
            }

            playButton.addEventListener('click', function() {
                if (audio.paused) {
                    audio.play().catch(function() {});
                } else {
                    audio.pause();
                }
            });

            progressBar.addEventListener('input', function() {
                if (audio.duration) {
                    audio.currentTime = (progressBar.value / 100) * audio.duration;
                    updateProgress();
                }
            });

            audio.addEventListener('loadedmetadata', updateProgress);
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('play', updatePlayIcon);
            audio.addEventListener('pause', updatePlayIcon);
            audio.addEventListener('ended', updatePlayIcon);

            updatePlayIcon();
            updateProgress();

            // Autoplay can be blocked by some browsers; the play button remains available.
            audio.play().catch(function() { updatePlayIcon(); });
        });
    </script>
